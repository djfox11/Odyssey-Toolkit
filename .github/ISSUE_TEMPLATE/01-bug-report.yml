name: Report a bug
description: Report broken or unexpected Odyssey Toolkit behavior
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Odyssey Toolkit.

        Do not upload ROMFS files, extracted game assets, encryption keys,
        or Blender projects containing copyrighted game data.

  - type: dropdown
    id: workflow
    attributes:
      label: Affected workflow
      options:
        - Installation or update
        - Stage Importer
        - Standalone Asset Importer
        - Skeletal animation
        - Material animation
        - Camera animation
        - Materials or textures
        - Diagnostics
        - User interface
        - Other
    validations:
      required: true

  - type: input
    id: toolkit-version
    attributes:
      label: Odyssey Toolkit version
      placeholder: "0.40.0"
    validations:
      required: true

  - type: input
    id: blender-version
    attributes:
      label: Blender version
      placeholder: "4.5.0"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest numbered sequence that reproduces the problem.
      placeholder: |
        1. Open the Odyssey tab
        2. Select ...
        3. Press ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and console output
      description: Redact private filesystem paths before posting.
      render: shell

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - Unknown
        - No
        - Yes

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have not attached game files, keys, or copyrighted assets.
          required: true
